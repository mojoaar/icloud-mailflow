{{define "login"}}
<div class="card auth-card-sm">
    <h1>iCloud Mailflow</h1>
    <p class="hint mb-3">Sign in to manage your rules</p>
    {{if .Error}}
    <div class="toast toast-error static mb-2">{{.Error}}</div>
    {{end}}
    <form method="POST" action="/login"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required class="w-full">
        </div>
        <button type="submit" class="btn btn-primary w-full">Sign In</button>
    </form>
</div>
{{end}}
