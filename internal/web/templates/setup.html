{{define "setup"}}
<div class="card auth-card">
    <h1>Welcome to iCloud Mailflow</h1>
    <p class="hint mb-3">Let's get you set up.</p>
    <form method="POST" action="/setup">
        <div class="form-group">
            <label for="setup-password">Admin Password</label>
            <input type="password" id="setup-password" name="password" required minlength="8" class="w-full">
        </div>
        <div class="form-group">
            <label for="setup-email">iCloud Email</label>
            <input type="email" id="setup-email" name="imap_email" required placeholder="you@icloud.com" class="w-full">
        </div>
        <div class="form-group">
            <label for="setup-app-password">App-Specific Password</label>
            <input type="password" id="setup-app-password" name="imap_password" required class="w-full">
            <small class="muted">Generate at appleid.apple.com → Sign-In and Security → App-Specific Passwords</small>
        </div>
        <button type="submit" class="btn btn-primary w-full">Start Using Mailflow</button>
    </form>
</div>
{{end}}
