{{define "contacts_list"}}
{{range .Contacts}}
<div class="contact-suggestion" style="padding:4px 8px;cursor:pointer">
    {{if .Name}}<strong>{{.Name}}</strong> &lt;{{.Email}}&gt;{{else}}{{.Email}}{{end}}
</div>
{{else}}
<div style="padding:4px 8px;color:var(--muted)">No contacts found</div>
{{end}}
{{end}}
