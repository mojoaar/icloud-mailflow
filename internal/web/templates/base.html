<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);else if(window.matchMedia('(prefers-color-scheme:light)').matches)document.documentElement.setAttribute('data-theme','light')})();
    </script>
    <title>iCloud Mailflow — {{.Title}}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon-180.png">
    <meta name="theme-color" content="#0d1117">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/styles/atom-one-dark.min.css">
    {{if .MonoFont}}<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">{{end}}
</head>
<body{{if .MonoFont}} class="font-mono"{{end}}>
    <nav>
        <a href="/dashboard" class="brand">iCloud Mailflow</a>
        {{if .ShowNav}}
        <div class="nav-links">
            <a href="/dashboard"><i data-lucide="layout-dashboard" class="nav-icon"></i> Dashboard</a>
            <a href="/activity"><i data-lucide="list" class="nav-icon"></i> Activity</a>
            <a href="/rules"><i data-lucide="git-branch" class="nav-icon"></i> Rules</a>
            <a href="/settings"><i data-lucide="settings" class="nav-icon"></i> Settings</a>
            <a href="/logout"><i data-lucide="log-out" class="nav-icon"></i> Logout</a>
            <a href="#" style="font-size:0.85rem;padding:0" onclick="var t=document.documentElement.getAttribute('data-theme')==='light'?'':'light';document.documentElement.setAttribute('data-theme',t);localStorage.setItem('theme',t);return false" title="Toggle theme">
                <i data-lucide="moon" class="nav-icon"></i>
            </a>
        </div>
        {{end}}
    </nav>
    <main>{{.Content}}</main>
    <footer>
        Crafted with ❤️ by <a href="https://johansen.foo" target="_blank">Morten Johansen</a> ·
        <a href="https://github.com/mojoaar/icloud-mailflow" target="_blank">GitHub</a> ·
        <a href="https://github.com/mojoaar/icloud-mailflow/blob/main/LICENSE" target="_blank">MIT</a> ·
        <a href="/stats">Stats</a> ·
        <a href="/docs">Docs</a> ·
        v{{.Version}} · © 2026
    </footer>
    <script src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.2/highlight.min.js"></script>
    <script defer>lucide.createIcons();document.body.addEventListener('htmx:afterSettle',()=>{lucide.createIcons();hljs.highlightAll()});window.addEventListener('load',()=>hljs.highlightAll())</script>
</body>
</html>
