name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod verify

      - run: test -z "$(gofmt -l .)"

      - run: go vet ./...

      - name: Run tests with coverage
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Statement Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            go test -cover ./... | awk '/ok[ \t]+/ { print "| `" $2 "` | " $(NF-2) " |" }' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            TOTAL=$(go tool cover -func=coverage.out | grep "total:" | awk '{print $3}')
            echo "**Total Statement Coverage:** \`$TOTAL\`" >> $GITHUB_STEP_SUMMARY
          fi
